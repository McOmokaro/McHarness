[workspace]
resolver = "2"
members = [
    "core",
    "crates/mch-scope",
    "crates/mch-gate",
    "crates/mch-ledger",
    "crates/mch-compaction",
    "crates/mch-audit",
    "crates/mch-core",
    "crates/mch-loop",
    "crates/mch-transport",
    "crates/mch-snapshot",
    "crates/mch-memory",
    "crates/mch-mcp",
    "crates/mch-dsh-cordis",
    "crates/mch-dsh-llm",
    "crates/mch-dsh-agent",
    "crates/mch-dsh-dynamic",
    "crates/mch-dsh",
    "crates/mch-rea",
    "crates/mch-brain",
    "crates/mch-browser",
    "crates/mch-cyber",
    "crates/mch-kali",
]
default-members = [
    "crates/mch-scope",
    "crates/mch-gate",
    "crates/mch-ledger",
    "crates/mch-compaction",
    "crates/mch-audit",
    "crates/mch-core",
    "crates/mch-loop",
    "crates/mch-transport",
    "crates/mch-snapshot",
    "crates/mch-memory",
    "crates/mch-mcp",
    "crates/mch-dsh-cordis",
    "crates/mch-dsh-llm",
    "crates/mch-dsh-agent",
    "crates/mch-dsh-dynamic",
    "crates/mch-dsh",
    "crates/mch-rea",
    "crates/mch-brain",
    "crates/mch-browser",
    "crates/mch-cyber",
    "crates/mch-kali",
]

[workspace.package]
version = "0.0.1"
edition = "2021"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["full", "rt-multi-thread", "macros"] }
tokio-stream = { version = "0.1", features = ["time"] }
tokio-util = { version = "0.7", features = ["sync"] }
tokio-tungstenite = { version = "0.21", features = ["native-tls"] }
tungstenite = "0.21"
http = "1"
reqwest = { version = "0.12", features = ["json", "rustls-tls", "stream"] }
tracing = { version = "0.1", features = ["std"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }
futures = "0.3"
git2 = "0.18"
rand = "0.8"
async-trait = "0.1"
anyhow = "1"
schemars = "0.8"
ed25519-dalek = "2"
rand_core = "0.6"
zeroize = "1"
# sarif = { version = "0.3", features = ["serde"] }  # Not available on crates.io
regex = "1"
chrono = { version = "0.4", features = ["serde"] }
sha2 = "0.10"