[workspace]
resolver = "2"
members = [
    "core",
    "crates/mch-scope",
    "crates/mch-gate",
    "crates/mch-ledger",
    "crates/mch-core",
]
default-members = [
    "crates/mch-scope",
    "crates/mch-gate",
    "crates/mch-ledger",
    "crates/mch-core",
]

[workspace.package]
version = "0.0.1"
edition = "2021"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"
