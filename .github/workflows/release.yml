name: Release Build

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Build Rust Binary
        run: cargo build --release --target x86_64-unknown-linux-gnu
          
      - name: Rename Binary
        run: cp target/x86_64-unknown-linux-gnu/release/mcharness ./mcharness-linux-amd64

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: ./mcharness-linux-amd64
          generate_release_notes: true
          draft: false
          prerelease: false
