name: Release Build

on:
  push:
    tags:
      - 'v*' # Triggers on any tag starting with v (e.g., v0.1.0)

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Build Rust Binary
        run: |
          cargo build --release --target x86_64-unknown-linux-gnu
          
      - name: Rename Binary for WSL/Linux
        run: |
          cp target/x86_64-unknown-linux-gnu/release/mcharness ./mcharness-linux-amd64

      - name: Create Release and Upload Asset
        uses: softprops/action-gh-release@v2
        with:
          files: ./mcharness-linux-amd64
          generate_release_notes: true
          draft: false
          prerelease: false
