[package]
name = "mch-kali"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "McHarness Kali — Omarchy lazy-loading operator for the Kali Linux toolkit (forged from BugBountyFramework/BugHunter)"

[dependencies]
# Workspace dependencies
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["full", "rt-multi-thread", "macros", "process"] }
tracing = { workspace = true, features = ["std"] }
anyhow.workspace = true
uuid = { workspace = true, features = ["v4", "serde"] }
chrono = { workspace = true, features = ["serde"] }
regex = { workspace = true }
async-trait = { workspace = true }
sha2.workspace = true

# Attestation of tool output (Spotlight-style Ed25519 attestation)
mch-cyber = { path = "../mch-cyber" }

[dev-dependencies]
tempfile = "3"
