[package]
name = "mch-anatomy"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "McHarness Anatomy — Human Archetypes, Cognitive Workflows & Behavioral Heuristics for LLM Agent Emulation"

[dependencies]
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["full", "rt-multi-thread", "macros"] }
tracing = { workspace = true, features = ["std"] }
tracing-subscriber = { workspace = true, features = ["env-filter"] }
uuid = { workspace = true, features = ["v4", "serde"] }
futures = { workspace = true }
async-trait = { workspace = true }
anyhow = { workspace = true }
schemars = { workspace = true }
rand = { workspace = true }
chrono = { workspace = true, features = ["serde"] }
regex = { workspace = true }

# Integration with mch-brain for procedural memory storage
mch-brain = { path = "../mch-brain", optional = true }

# Internal crates
mch-core = { path = "../mch-core" }

[dev-dependencies]
tokio-test = "0.4"
proptest = "1.2"

[features]
default = []
procedural-memory = ["mch-brain"]