[package]
name = "mch-report"
version = "0.0.1"
edition = "2021"
license = "MIT"
description = "Morning Report compiler: Markdown newspaper + TTS audio generation for Overnight Agent"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["full", "rt-multi-thread", "macros"] }
tracing = { version = "0.1", features = ["std"] }
anyhow = "1"
uuid = { version = "1", features = ["v4", "serde"] }
schemars = "0.8"
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }