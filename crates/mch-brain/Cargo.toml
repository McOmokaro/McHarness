[package]
name = "mch-brain"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "McHarness Brain — Native Rust memory graph for LLM agents (forged from LycheeMem/LycheeMemory)"

[dependencies]
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["full", "rt-multi-thread", "macros"] }
tracing = { workspace = true, features = ["std"] }
tracing-subscriber = { workspace = true, features = ["env-filter"] }
uuid = { workspace = true, features = ["v4", "serde"] }
futures = { workspace = true }
async-trait = { workspace = true }
anyhow = { workspace = true }
schemars = { workspace = true }
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "sqlite", "uuid", "chrono", "json", "migrate"] }
tokenizers = "0.20"
tiktoken-rs = "0.7"
rand = { workspace = true }
sha2 = "0.10"
chrono = { version = "0.4", features = ["serde"] }
url = "2"
reqwest = { workspace = true, features = ["json", "rustls-tls"] }
async-stream = "0.3"
dashmap = "6"
parking_lot = "0.12"
lru = "0.12"
hex = "0.4"